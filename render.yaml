# Render Blueprint: one click creates the web service and the PostgreSQL database.
services:
  - type: web
    name: cyberstore
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cyberstore-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # Render asks for it when the Blueprint is created
      - key: CLOUDINARY_URL
        sync: false   # cloudinary://API_KEY:API_SECRET@CLOUD_NAME (keeps photos after restarts)

databases:
  - name: cyberstore-db
    plan: free
    region: frankfurt
    databaseName: cyberstore
    user: cyberstore
