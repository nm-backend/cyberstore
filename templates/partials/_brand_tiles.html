{% load shop_tags %}{% if brand_tiles %}
<section class="brand-tiles-section">
  <div class="section-head">
    <h2>Бренды</h2>
    <span class="muted brand-tiles-hint">Выберите производителя</span>
  </div>
  <div class="tile-strip">
    {% for item in brand_tiles %}
      <a class="tile-card" href="?brand={{ item.brand.slug }}">
        <span class="tile-card-media">
          {% if item.brand.logo %}
            <img class="tile-card-img" src="{{ item.brand.logo.url }}" alt="" loading="lazy" width="160" height="160">
          {% else %}
            <span class="tile-card-monogram" aria-hidden="true">{{ item.brand.name|first|upper }}</span>
          {% endif %}
          <span class="tile-card-count" title="Товаров бренда">{{ item.count }}</span>
        </span>
        <span class="tile-card-name">{{ item.brand.name }}</span>
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
