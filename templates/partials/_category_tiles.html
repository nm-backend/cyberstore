{% load shop_tags %}{% if categories %}
<section class="category-tiles-section">
  {% if title %}<div class="section-head"><h2>{{ title }}</h2></div>{% endif %}
  <div class="category-tiles">
    {% for c in categories %}
      <a class="category-tile" href="{{ c.get_absolute_url }}">
        {% if c.image %}
          <img class="category-tile-img" src="{{ c.image.url }}" alt="{{ c.name }}" loading="lazy" width="480" height="300">
        {% else %}
          <span class="category-tile-img" aria-hidden="true">{% category_icon c "ic" %}</span>
        {% endif %}
        <span class="category-tile-body">
          <span class="category-tile-name">{{ c.name }}</span>
          {% if c.description %}<span class="category-tile-desc">{{ c.description }}</span>{% endif %}
        </span>
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
